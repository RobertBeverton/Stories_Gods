name: Validate world data

# Checks this world's stories and lore against the Stories app's rules.
# It does not build or deploy a site: the Stories repo does that.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Side by side, so the checks read this world as ../Gods-PrimarySchool.
      - uses: actions/checkout@v4
        with:
          path: Gods-PrimarySchool
      - uses: actions/checkout@v4
        with:
          repository: RobertBeverton/Stories
          path: Stories
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Stories/package-lock.json
      - run: npm ci
        working-directory: Stories
      - run: node ../Stories/scripts/validate-world-data.mjs --strict --world legend-lane
        working-directory: Gods-PrimarySchool
